<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="webstartsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#E94625"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glossy Rounded Square Container -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="#121216" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6"/>

  <!-- Geometric Modern 'W' Logo Icon -->
  <g filter="url(#subtleGlow)">
    <!-- Left Stem -->
    <path d="M 108 140 L 168 140 L 224 340 L 164 340 Z" fill="url(#webstartsGradient)"/>
    <!-- Center-Left Diagonal -->
    <path d="M 164 340 L 224 340 L 284 190 L 224 190 Z" fill="url(#webstartsGradient)" opacity="0.95"/>
    <!-- Center-Right Diagonal -->
    <path d="M 228 190 L 288 190 L 348 340 L 288 340 Z" fill="url(#webstartsGradient)" opacity="0.95"/>
    <!-- Right Stem -->
    <path d="M 288 340 L 348 340 L 404 140 L 344 140 Z" fill="url(#webstartsGradient)"/>
  </g>
</svg>
